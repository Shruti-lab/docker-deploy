services:
  admins_service:
    build: ./admins
    container_name: admins_service
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./admins/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./admins:/app
    networks:
      - app_network

  auth_service:
    build: ./auth
    container_name: auth_service
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./auth/.env
    depends_on:
      db:
        condition: service_healthy
      admins_service:
        condition: service_started
    volumes:
      - ./auth:/app
    networks:
      - app_network

  users_service:
    build: ./users
    container_name: users_service
    restart: always
    ports:
      - "5002:5002"
    env_file:
      - ./users/.env
    depends_on:
      db:
        condition: service_healthy
      admins_service:
        condition: service_started
    volumes:
      - ./users:/app
    networks:
      - app_network
 

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s


volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
